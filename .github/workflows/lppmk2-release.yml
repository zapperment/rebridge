# Publishes the Launchpad Pro [MK2] remote codec for Launchnik as a zip, see
# lpp-release.yml, whenever anything it is made from changes on main.
name: Launchpad Pro [MK2] release

on:
  push:
    branches: [main]
    paths:
      - "src/lpp/**"
      - "src/lppmk2/**"
      - "src/lib/**"
      - "src/config/constants.lua"
      - "src/reason/codecs/novation/LPPMK2*"
      - "src/reason/maps/novation/LPPMK2*"
      - "src/reason/release/LPPMK2*"
      - "build.sh"
      - "scripts/package-release.sh"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/lpp-release.yml"
      - ".github/workflows/lppmk2-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the zip in the release (off to only test and package)
        type: boolean
        default: true

permissions:
  contents: write

# Two runs must not replace the release at the same time
concurrency:
  group: lppmk2-release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/lpp-release.yml
    with:
      controller: LPPMK2
      tag: lppmk2-latest
      title: Launchpad Pro [MK2] remote codec for Launchnik
      zip-file: temp/release/Launchpad-Pro-MK2-remote-codec-for-Launchnik.zip
      publish: ${{ github.event_name == 'push' || inputs.publish }}
