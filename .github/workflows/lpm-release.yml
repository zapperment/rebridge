# Publishes the Launchpad Mini remote codec for Launchnik as a zip, see
# lpcommon-release.yml, whenever anything it is made from changes on main.
name: Launchpad Mini release

on:
  push:
    branches: [main]
    paths:
      - "src/lpcommon/**"
      - "src/lpm/**"
      - "src/lib/**"
      - "src/config/constants.lua"
      - "src/reason/codecs/novation/LPM*"
      - "src/reason/maps/novation/LPM*"
      - "src/reason/release/LPM*"
      - "build.sh"
      - "scripts/package-release.sh"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/lpcommon-release.yml"
      - ".github/workflows/lpm-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the zip in the release (off to only test and package)
        type: boolean
        default: true

permissions:
  contents: write

# Two runs must not replace the release at the same time
concurrency:
  group: lpm-release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/lpcommon-release.yml
    with:
      controller: LPM
      tag: lpm-latest
      title: Launchpad Mini remote codec for Launchnik
      zip-file: temp/release/Launchpad-Mini-remote-codec-for-Launchnik.zip
      publish: ${{ github.event_name == 'push' || inputs.publish }}
