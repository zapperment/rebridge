# Publishes the Launchpad Pro [MK3] remote codec for Launchnik: a zip with the
# production codec, the remote map and installation instructions, attached to
# one pre-release that every run replaces, so that its download link never
# changes and anyone can download it without a GitHub account.
name: Launchpad Pro [MK3] release

on:
  push:
    branches: [main]
    paths:
      - "src/lppmk3/**"
      - "src/lib/**"
      - "src/config/constants.lua"
      - "src/reason/codecs/novation/LPPMK3*"
      - "src/reason/maps/novation/LPPMK3*"
      - "src/reason/release/LPPMK3*"
      - "build.sh"
      - "scripts/package-release.sh"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/lppmk3-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the zip in the release (off to only test and package)
        type: boolean
        default: true

permissions:
  contents: write

# Two runs must not replace the release at the same time
concurrency:
  group: lppmk3-release
  cancel-in-progress: false

env:
  CONTROLLER: LPPMK3
  TAG: lppmk3-latest
  TITLE: Launchpad Pro [MK3] remote codec for Launchnik
  # Not "ZIP": zip reads that variable as extra command-line arguments
  ZIP_FILE: temp/release/Launchpad-Pro-MK3-remote-codec-for-Launchnik.zip

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      # Lua 5.1 is the version Reason's remote codec engine runs, as in the dev
      # container
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua

      - name: Test
        run: yarn test

      - name: Package
        run: yarn package:lppmk3

      # Move the tag to this commit first, so that the release, created or
      # replaced below, points to it
      - name: Tag
        if: github.event_name == 'push' || inputs.publish
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse --short HEAD)"
          notes="Built on $(date -u +%Y-%m-%d) from commit ${commit}.

          Download **$(basename "$ZIP_FILE")** below; how to install it is in the readme.txt inside the zip.

          This release is replaced whenever the codec changes, so its download link always gets the latest version:
          https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$ZIP_FILE")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$ZIP_FILE" --title "$TITLE" --notes "$notes" --prerelease --verify-tag
          fi
